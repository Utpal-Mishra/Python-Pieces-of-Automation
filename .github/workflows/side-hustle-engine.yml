name: Side Hustle Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 6"

jobs:
  build-lead-package:
    if: ${{ vars.SIDE_HUSTLE_AUTOMATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r side_hustle_engine/requirements.txt

      - name: Generate lead package
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          python side_hustle_engine/main.py \
            --config side_hustle_engine/config.example.json \
            --output side_hustle_engine/output

      - name: Upload lead package
        uses: actions/upload-artifact@v4
        with:
          name: side-hustle-leads-${{ github.run_number }}
          path: side_hustle_engine/output
          retention-days: 14
